baseURL = "https://blog.iankulin.com"
title   = "blog.iankulin.com"
theme   = "zen"
locale  = "en-AU"

enableRobotsTXT = true
buildDrafts     = false
buildFuture     = false

[pagination]
  pagerSize = 20

[markup.goldmark.renderer]
  unsafe = true          # posts contain raw HTML from the WordPress migration

[markup.highlight]
  codeFences  = true
  guessSyntax = true
  style       = "nord"
  noClasses   = true

[permalinks]
  posts = "/:slug/"

[[module.mounts]]
  source = "static/images"
  target = "assets/images"

[[module.mounts]]
  source = "static"
  target = "static"

[[module.mounts]]
  source = "content"
  target = "content"

[[module.mounts]]
  source = "layouts"
  target = "layouts"

[[module.mounts]]
  source = "data"
  target = "data"

[[module.mounts]]
  source = "i18n"
  target = "i18n"

[[module.mounts]]
  source = "archetypes"
  target = "archetypes"

[[module.mounts]]
  source = "assets"
  target = "assets"

[taxonomies]
  tag = "tags"

[params]
  logo         = true
  logopath     = "favicon.svg"
  description  = "web dev - homelab - iOS dev"
  dateformat   = "2 January, 2006"
  submitted    = true
  mainSections = ["posts"]
  poweredby    = false
  feedlinks    = true

  [params.author]
    name = "ian"

[[menu.main]]
name   = "about/"
url    = "/about/"
weight = 1

[[menu.main]]
name   = "posts/"
url    = "/posts/"
weight = 2

[[menu.main]]
name   = "search/"
url    = "/search/"
weight = 4
